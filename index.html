const GS_CODE="/**\n * Dompetku — Backup ke Google Sheets (Apps Script)\n *\n * Cara pasang:\n * 1. Buat Google Sheet baru → menu Extensions → Apps Script → tempel seluruh kode ini.\n * 2. Ganti TOKEN di bawah dengan kode rahasia buatanmu sendiri.\n * 3. Deploy → New deployment → jenis \"Web app\"\n *    Execute as: Me | Who has access: Anyone → Deploy → izinkan akses → salin URL (…/exec).\n * 4. Di aplikasi: Atur → Backup ke Spreadsheet → tempel URL dan kode rahasia.\n *\n * Setiap backup menulis ulang tab: Ringkasan, Transaksi, Target, Hutang, Anggaran, Dompet, Pengaturan,\n * dan menambah satu snapshot JSON di tab \"Backup\" (dipakai untuk Pulihkan).\n * Jangan hapus tab \"Backup\". Edit manual di tab lain akan tertimpa saat backup berikutnya.\n */\nconst TOKEN = 'GANTI_DENGAN_KODE_RAHASIA';\nconst KEEP = 10;      // jumlah snapshot terakhir yang disimpan\nconst CHUNK = 40000;  // batas karakter per sel (batas Sheets 50.000)\n\nfunction doGet(e) {\n  const p = (e && e.parameter) || {};\n  if (!cek(p.token)) return json({ ok: false, error: 'Kode rahasia salah' });\n  const sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('Backup');\n  const rows = sh && sh.getLastRow() > 1 ? sh.getRange(2, 1, sh.getLastRow() - 1, 4).getValues() : [];\n  const last = rows.reduce((m, r) => (String(r[0]) > m ? String(r[0]) : m), '');\n  if (p.action === 'restore') {\n    if (!last) return json({ ok: false, error: 'Belum ada backup di spreadsheet' });\n    const parts = rows.filter(r => String(r[0]) === last).sort((a, b) => a[1] - b[1]);\n    return json({ ok: true, at: last, data: JSON.parse(parts.map(r => r[3]).join('')) });\n  }\n  return json({ ok: true, last: last || null });\n}\n\nfunction doPost(e) {\n  const lock = LockService.getScriptLock();\n  try {\n    lock.waitLock(20000);\n    const b = JSON.parse(e.postData.contents);\n    if (!cek(b.token)) return json({ ok: false, error: 'Kode rahasia salah' });\n    const ss = SpreadsheetApp.getActiveSpreadsheet(), d = b.data || {};\n    const tx = d.tx || [];\n\n    const bulan = {};\n    tx.forEach(x => {\n      const m = String(x.d).slice(0, 7);\n      bulan[m] = bulan[m] || { i: 0, o: 0 };\n      if (x.t === 'in') bulan[m].i += x.a; else bulan[m].o += x.a;\n    });\n    tulis(ss, 'Ringkasan', ['Bulan', 'Pemasukan', 'Pengeluaran', 'Arus bersih'],\n      Object.keys(bulan).sort().reverse().map(m => [m, bulan[m].i, bulan[m].o, bulan[m].i - bulan[m].o]));\n\n    tulis(ss, 'Transaksi', ['ID', 'Tanggal', 'Tipe', 'Nominal', 'Kategori', 'Catatan', 'Dompet', 'Terencana'],\n      tx.slice().sort((a, c) => (a.d < c.d ? 1 : -1)).map(x =>\n        [String(x.id), x.d, x.t === 'in' ? 'Pemasukan' : 'Pengeluaran', x.a, x.c, x.n, x.w || '', x.pl || '']));\n\n    tulis(ss, 'Target', ['Nama', 'Target', 'Terkumpul', 'Alokasi/bulan', 'Tenggat'],\n      (d.gl || []).map(x => [x.n, x.t, x.p, x.al || 0, x.dl || '']));\n\n    tulis(ss, 'Hutang', ['Nama', 'Total', 'Terbayar', 'Cicilan/bulan', 'Jatuh tempo (tgl)'],\n      (d.db || []).map(x => [x.n, x.t, x.p, x.m || 0, x.dd || '']));\n\n    tulis(ss, 'Anggaran', ['Kategori', 'Anggaran/bulan'],\n      Object.keys(d.bud || {}).map(k => [k, d.bud[k]]));\n\n    tulis(ss, 'Dompet', ['Nama'], (d.wl || []).map(w => [w]));\n\n    const as = d.as || {};\n    tulis(ss, 'Pengaturan', ['Pengaturan', 'Nilai'], [\n      ['Tanggal gajian', as.pd || 25], ['Pemasukan diharapkan', as.inc || 0],\n      ['Tagihan tetap lain', as.bill || 0], ['Saldo minimum aman', as.buf || 0],\n      ['Skenario hemat (-%)', as.hm == null ? 20 : as.hm], ['Terburuk (+%)', as.wr == null ? 30 : as.wr],\n      ['Target tabungan bulanan', d.tg || 0]]);\n\n    simpan(ss, String(b.at || new Date().toISOString()), JSON.stringify(d));\n    return json({ ok: true, tx: tx.length, at: new Date().toISOString() });\n  } catch (err) {\n    return json({ ok: false, error: String(err) });\n  } finally {\n    try { lock.releaseLock(); } catch (_) {}\n  }\n}\n\nfunction cek(t) { return TOKEN !== 'GANTI_DENGAN_KODE_RAHASIA' && t === TOKEN; }\n\nfunction json(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\n\nfunction tulis(ss, nama, head, rows) {\n  const sh = ss.getSheetByName(nama) || ss.insertSheet(nama);\n  sh.clearContents();\n  sh.getRange(1, 1, 1, head.length).setValues([head]).setFontWeight('bold');\n  if (rows.length) sh.getRange(2, 1, rows.length, head.length).setValues(rows);\n  sh.setFrozenRows(1);\n}\n\nfunction simpan(ss, at, teks) {\n  const sh = ss.getSheetByName('Backup') || ss.insertSheet('Backup');\n  sh.getRange('A:A').setNumberFormat('@');\n  sh.getRange('D:D').setNumberFormat('@');\n  if (sh.getLastRow() === 0) sh.getRange(1, 1, 1, 4).setValues([['Waktu', 'Bagian', 'Total', 'Data']]).setFontWeight('bold');\n  const n = Math.ceil(teks.length / CHUNK) || 1, baris = [];\n  for (let i = 0; i < n; i++) baris.push([at, i + 1, n, teks.substr(i * CHUNK, CHUNK)]);\n  sh.getRange(sh.getLastRow() + 1, 1, baris.length, 4).setValues(baris);\n  const semua = sh.getRange(2, 1, sh.getLastRow() - 1, 4).getValues();\n  const waktu = Array.from(new Set(semua.map(r => String(r[0])))).sort();\n  if (waktu.length > KEEP) {\n    const buang = new Set(waktu.slice(0, waktu.length - KEEP));\n    const sisa = semua.filter(r => !buang.has(String(r[0])));\n    sh.getRange(2, 1, semua.length, 4).clearContent();\n    sh.getRange(2, 1, sisa.length, 4).setValues(sisa);\n  }\n}\n";

async function gsCall(act,payload){

  const t0=Date.now(),body=JSON.stringify({token:g.tok||'',at:new Date().toISOString(),data:payload}),H={'Content-Type':'text/plain;charset=utf-8'};
  try{const r=await fetch(g.url,{method:'POST',headers:H,body});return await r.json()}
  catch(e){

   await wait(2000);const a=await ping();if(a)return{ok:true,tx:payload.tx.length};
   try{await fetch(g.url,{method:'POST',mode:'no-cors',headers:H,body})}catch(_){}

   if(a===null&&c===null)throw new Error('offline');
   return{ok:false,error:'Tidak ada konfirmasi dari script. Cek URL dan kode rahasia.'}}
 }catch(e){gsMsg('Gagal terhubung. Buka app dari domain sendiri (Netlify/Vercel), pastikan URL benar dan Web App dibagikan ke "Siapa saja".');return null}
}
